name: ra_birthday_site
description: A special romantic birthday website for RA
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Fonts
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.0
  animated_text_kit: ^4.2.3
  confetti: ^0.7.0

  # Gallery & Media
  photo_view: ^0.15.0
  audioplayers: ^6.1.0

  # Utils
  flutter_staggered_grid_view: ^0.7.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/1.jpg
